name: macOS

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Protocol, read-back, connector and preset presentation tests
        run: sh Client/tests/run-macos.sh

  build:
    needs: tests
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify universal installer from current source
        run: sh Client/macos/build-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SonyBridge-XM4C-macOS
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*/SonyBridge XM4C.dmg
            dist/*/SonyBridge XM4C.dmg.sha256
